<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 18px 18px 20px;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #0f172a;
        background: #fff;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #475569;
        margin: 0 0 10px;
      }
      ol {
        font-size: 13px;
        line-height: 1.7;
        color: #334155;
        padding-left: 20px;
        margin: 0;
      }
      .badge {
        display: inline-block;
        background: #e0f2fe;
        color: #0369a1;
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>📸 推文转图卡</h1>
    <p>在 x.com 上把帖子的文字和图片一键转成精美图片，方便分享。</p>
    <ol>
      <li>打开任意一条帖子</li>
      <li>点操作栏里的 <span class="badge">📸</span> 按钮</li>
      <li>预览后「下载」或「复制」图片</li>
    </ol>
    <p style="font-size:11px;color:#94a3b8;margin-top:10px">
      本扩展为第三方工具，与 X Corp. 无任何关联。
    </p>
  </body>
</html>
